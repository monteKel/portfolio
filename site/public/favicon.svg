<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- disco de acreção: lado que vem em nossa direção mais quente e claro (Doppler), como no fundo do site -->
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4a1c"/>
      <stop offset="0.5" stop-color="#ff7b1c"/>
      <stop offset="0.8" stop-color="#ffad33"/>
      <stop offset="1" stop-color="#fff8ec"/>
    </linearGradient>
    <!-- halo: o disco de trás, curvado em volta da sombra pela gravidade (mais claro em cima) -->
    <linearGradient id="halo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1d0"/>
      <stop offset="0.45" stop-color="#ffad33"/>
      <stop offset="1" stop-color="#ff4a1c"/>
    </linearGradient>
    <!-- brilho suave em volta: a luz do disco, não um planeta sólido -->
    <radialGradient id="glow">
      <stop offset="0.45" stop-color="#ff7b1c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff4a1c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#000"/>
  <circle cx="16" cy="16" r="13" fill="url(#glow)"/>
  <g transform="rotate(-10 16 16)">
    <ellipse cx="16" cy="16" rx="14.5" ry="2.6" fill="none" stroke="url(#disk)" stroke-width="2"/>
    <circle cx="16" cy="16" r="8" fill="none" stroke="url(#halo)" stroke-width="3.2"/>
    <circle cx="16" cy="16" r="6.4" fill="#000"/>
    <path d="M1.5 16 A14.5 2.6 0 0 0 30.5 16" fill="none" stroke="url(#disk)" stroke-width="2"/>
  </g>
</svg>
